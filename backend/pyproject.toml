[project]
name = "zoom-clone-backend"
version = "1.0.0"
description = "FastAPI backend for a Zoom-style video conferencing app"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends()/Path() in signatures is idiomatic
